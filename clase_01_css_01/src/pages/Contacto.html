<head>
    <meta charset="UTF-8">

    <meta name="keywords" content="contacto, información, productos">
    <title>Black and White</title>
    <link rel="icon" href="./src/assets/images/B&White.png">

<body>
    <header>
        <nav>
            <nav>
                <a href="Index.html">Inicio</a>
                <a href="Nosotros.html">Nosotros</a>
                <a href="Productos.html">Productos</a>
                <a href="Contacto.html">Contacto</a>
                <br>
            </nav>
        </nav>
    </header>

    <main>
        <section>
            <h1>Contacto</h1>
            <h2>¿Tenés alguna consulta, reclamo o querés hacer una devolución?</h2>
            <p>Estamos aquí para ayudarte. Por favor, completá el siguiente formulario y nos comunicaremos con vos a la brevedad.</p>
            <form>
                <label for="nombre">
                    Nombre <br>
                    <input type="text" id="nombre" name="nombre" required>
                </label>
                <br>
                <br>
                <label for="email">
                    Email <br>
                    <input type="email" id="email" name="email" required>
                </label>
                <br>
                <br>
                <label for="comentarios">
                    Comentarios <br>
                </label>
                <textarea name="comentarios" rows="4" cols="50" placeholder="Dejanos tu consulta"></textarea>
                <br>
                <input type="submit" value="Enviar">
            </form>
        </section>
    </main>
</body>
</html>
